<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-gold: #BF953F;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
            --danger: #ff453a;
        }

        body { background: #000; margin: 0; padding: 20px; font-family: 'Montserrat', 'Noto Sans TC', sans-serif; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; }
        .title-brand { font-size: 3rem; font-weight: 900; text-align: center; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(20px); }
        .stat-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.7rem; opacity: 0.5; }

        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(40px); transition: 0.3s;
        }
        .key-card.is-sub { border-left: 5px solid #007AFF; transform: scale(0.98); }
        .key-card.is-ghost { border: 2px solid var(--danger); background: rgba(255, 69, 58, 0.1); }

        .role-tag { font-size: 0.65rem; font-weight: 900; padding: 4px 10px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
        .role-master { background: var(--gold-gradient); color: #000; }
        .role-sub { background: #007AFF; color: #fff; }

        .detail-drawer {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 600px; height: 100vh;
            background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(80px); z-index: 2000;
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-left: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
        }
        .detail-drawer.active { right: 0; box-shadow: -20px 0 60px rgba(0,0,0,0.8); }
        .drawer-header { padding: 30px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 30px; }

        .data-hero { background: var(--gold-gradient); color: #000; padding: 25px; border-radius: 25px; margin-bottom: 30px; text-align: center; }
        .revenue-val { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; }

        .record-card { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 18px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-action { background: var(--gold-gradient); color: #000; border: none; border-radius: 15px; padding: 12px 25px; font-weight: 800; cursor: pointer; }
        .btn-del { background: rgba(255,0,0,0.1); color: var(--danger); border: 1px solid rgba(255,0,0,0.2); padding: 12px; border-radius: 15px; margin-left: 10px; cursor: pointer; }
        
        .editable-name { cursor: pointer; border-bottom: 1px dashed transparent; }
        .editable-name:hover { color: var(--eth-gold); border-bottom: 1px dashed var(--eth-gold); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title-brand">AETHER MASTER</h1>
    
    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="count-total">--</span><span class="stat-label">總授權</span></div>
        <div class="stat-card"><span class="stat-val" id="count-active" style="color:#32D74B">--</span><span class="stat-label">運行中</span></div>
        <div class="stat-card"><span class="stat-val" id="count-warning" style="color:#FF9F0A">--</span><span class="stat-label">催款警告</span></div>
    </div>

    <input type="text" id="search-bar" style="width:100%; padding:20px; border-radius:50px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:#fff; margin-bottom:30px; outline:none;" placeholder="🔍 搜尋店號、負責人、金鑰..." onkeyup="filterKeys()">
    <div id="key-list"></div>
</div>

<div id="detail-drawer" class="detail-drawer">
    <div class="drawer-header">
        <h2 id="drawer-title" style="margin:0;">載入數據中...</h2>
        <div onclick="closeDrawer()" style="cursor:pointer; font-size:2rem;">&times;</div>
    </div>
    <div class="drawer-body" id="drawer-content"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allKeysCache = {}; 

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
        let total = snap.size, active = 0, warning = 0, now = Date.now();
        listArea.innerHTML = '';
        allKeysCache = {};

        snap.forEach(doc => { allKeysCache[doc.id] = doc.data(); });

        snap.forEach(doc => {
            const data = doc.data(), keyId = doc.id;
            const isSub = data.role === 'staff';
            const salonId = data.salonId || "";
            
            let masterInfo = null;
            if (isSub && salonId) {
                masterInfo = Object.values(allKeysCache).find(k => k.salonId === salonId && k.role === 'admin');
            }

            const isGhost = isSub && !masterInfo; 

            let timeTxt = "💎 永久授權", statusColor = "#32D74B";
            if (data.expire) {
                const days = Math.ceil((data.expire - now) / 86400000);
                if (days <= 0) { timeTxt = "❌ 已過期"; statusColor = "#ff453a"; }
                else { 
                    timeTxt = `⏳ 剩餘 ${days} 天`; active++;
                    if (days <= 7) { statusColor = "#FF9F0A"; warning++; }
                }
            } else active++;

            const card = document.createElement('div');
            card.className = `key-card ${isSub ? 'is-sub' : ''} ${isGhost ? 'is-ghost' : ''}`;
            card.dataset.search = `${data.ownerName} ${data.salonId} ${keyId}`.toLowerCase();
            card.innerHTML = `
                <div style="flex:1">
                    <h2 class="editable-name" onclick="editName('${keyId}', '${data.ownerName || ''}')">
                        ${data.ownerName || '未命名'} <span class="role-tag ${isSub ? 'role-sub' : 'role-master'}">${isSub ? '副金鑰' : '主金鑰'}</span>
                    </h2>
                    <div style="margin-top:10px; cursor:pointer; color:var(--eth-gold); font-size:0.9rem;" onclick="openDetail('${keyId}')">
                        <i class="fas fa-chart-line"></i> 查看每筆消費與顧客庫
                    </div>
                    <div style="font-size:0.8rem; margin-top:8px; opacity:0.5;">
                        ${isSub ? (isGhost ? '<span style="color:#ff453a">⚠️ 主金鑰已剔除</span>' : `隸屬於：${masterInfo ? masterInfo.ownerName : '主號'}`) : `店號：${data.salonId}`}
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="color:${statusColor}; font-weight:800; margin-bottom:15px;">${timeTxt}</div>
                    <div style="display:flex; align-items:center;">
                        <button class="btn-action" onclick="manageLicense('${keyId}')">管理</button>
                        <div class="btn-del" onclick="deleteKey('${keyId}')"><i class="fas fa-trash"></i></div>
                    </div>
                </div>
            `;
            listArea.appendChild(card);
        });
        document.getElementById('count-total').innerText = total;
        document.getElementById('count-active').innerText = active;
        document.getElementById('count-warning').innerText = warning;
    }

    async function editName(id, current) {
        const { value: newName } = await Swal.fire({ title: '修改名稱', input: 'text', inputValue: current, background: '#121212', color: '#fff', confirmButtonColor: '#BF953F', showCancelButton: true });
        if (newName !== undefined && newName !== "") { 
            await db.collection("LicenseKeys_Booking").doc(id).update({ ownerName: newName }); 
            fetchKeys(); 
        }
    }

    async function manageLicense(id) {
        const { value: mode } = await Swal.fire({
            title: '授權控管',
            background: '#121212', color: '#fff',
            input: 'select',
            inputOptions: { 'append': '🟢 疊加天數 (續約)', 'reset': '🔵 修正天數 (校正)', 'forever': '👑 升級永久' },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (!mode) return;
        const now = Date.now();
        const docData = allKeysCache[id];
        let base = (docData.expire && docData.expire > now) ? docData.expire : now;

        if (mode === 'forever') await db.collection("LicenseKeys_Booking").doc(id).update({ expire: null });
        else {
            const { value: days } = await Swal.fire({ title: '輸入天數', input: 'number', background: '#121212', color: '#fff' });
            if (days) {
                let final = (mode === 'append') ? (base + (days * 86400000)) : (now + (days * 86400000));
                await db.collection("LicenseKeys_Booking").doc(id).update({ expire: final });
            }
        }
        fetchKeys();
    }

    async function openDetail(id) {
        const data = allKeysCache[id];
        const drawer = document.getElementById('detail-drawer');
        const content = document.getElementById('drawer-content');
        document.getElementById('drawer-title').innerText = data.ownerName;
        drawer.classList.add('active');
        content.innerHTML = '<div style="text-align:center;padding:50px;"><i class="fas fa-spinner fa-spin"></i> 正在穿透雲端顧客庫...</div>';

        try {
            const sSnap = await db.collection("Salons").doc(data.salonId).get();
            if (!sSnap.exists) {
                content.innerHTML = `<div style="color:#ff453a; text-align:center; padding:50px;">⚠️ 該店尚未同步任何數據 (店號: ${data.salonId})</div>`;
                return;
            }

            const sData = sSnap.data();
            const apps = sData.appointments || []; 
            const tags = sData.tags || [];          
            const clients = sData.clients || [];    
            const stylists = sData.stylists || [];  

            let totalRev = 0;
            apps.forEach(a => { if(a.done) totalRev += parseFloat(a.price || 0); });

            content.innerHTML = `
                <div class="data-hero">
                    <div style="opacity:0.7; font-size:0.8rem; font-weight:900;">實時總業績 (V318 系統)</div>
                    <div class="revenue-val">$${totalRev.toLocaleString()}</div>
                </div>

                <h4 style="border-left:4px solid var(--eth-gold); padding-left:10px; margin-bottom:15px;">團隊成員 (${stylists.length})</h4>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px;">
                    ${stylists.length ? stylists.map(s => `<span style="background:rgba(255,255,255,0.1); padding:6px 15px; border-radius:12px; font-size:0.8rem; border:1px solid ${s.color || '#fff'}">${s.name}</span>`).join('') : '無設定'}
                </div>

                <h4 style="border-left:4px solid var(--eth-gold); padding-left:10px; margin-bottom:15px;">服務項目 (${tags.length})</h4>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px;">
                    ${tags.length ? tags.map(t => `<span style="background:rgba(212,175,55,0.1); color:var(--eth-gold); padding:6px 15px; border-radius:12px; font-size:0.8rem;">${t.name}</span>`).join('') : '無設定'}
                </div>

                <h4 style="border-left:4px solid var(--eth-gold); padding-left:10px; margin-bottom:15px;">顧客庫概況 (${clients.length} 位)</h4>
                <div style="font-size:0.85rem; opacity:0.7; margin-bottom:25px; background:rgba(255,255,255,0.03); padding:15px; border-radius:15px;">
                    ${clients.slice(0, 15).map(c => c.n || '匿名').join('、')} ${clients.length > 15 ? '...' : ''}
                </div>

                <h4 style="border-left:4px solid var(--eth-gold); padding-left:10px; margin-bottom:15px;">最近消費明細</h4>
                ${apps.slice().reverse().slice(0, 30).map(a => `
                    <div class="record-card" style="${a.done ? 'border-left:5px solid #32D74B;' : 'border-left:5px solid #FF9F0A;'}">
                        <div style="display:flex; justify-content:space-between; font-weight:800;">
                            <span>${a.n || '訪客'} <small style="opacity:0.4;">${a.p || ''}</small></span>
                            <span style="color:#32D74B;">$${a.price || 0}</span>
                        </div>
                        <div style="font-size:0.75rem; opacity:0.6; margin-top:8px;">
                            時間：${a.date} | 項目：${(a.tags || []).join(' + ')} <br>
                            狀態：${a.done ? '✅ 已結帳' : '⏳ 預約中'}
                        </div>
                    </div>
                `).join('') || '尚無紀錄'}
            `;
        } catch (e) { 
            console.error(e);
            content.innerHTML = '<div style="color:#ff453a; text-align:center; padding:50px;">數據穿透失敗</div>'; 
        }
    }

    function closeDrawer() { document.getElementById('detail-drawer').classList.remove('active'); }
    function filterKeys() {
        const kw = document.getElementById('search-bar').value.toLowerCase();
        document.querySelectorAll('.key-card').forEach(c => c.style.display = c.dataset.search.includes(kw) ? 'flex' : 'none');
    }
    async function deleteKey(id) {
        if ((await Swal.fire({ title:'確定註銷？', icon:'warning', showCancelButton:true, background:'#121212', color:'#fff' })).isConfirmed) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }
    window.onload = fetchKeys;
</script>
</body>
</html>
