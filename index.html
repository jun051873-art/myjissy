<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-blue: #0a1128;
            --eth-gold: #BF953F;
            --eth-glow: rgba(191, 149, 63, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
        }

        /* 🌌 以太流呼吸背景 */
        body {
            background: #000;
            margin: 0; padding: 40px 20px;
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 10%, rgba(191, 149, 63, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 80, 255, 0.08) 0%, transparent 40%);
            animation: pulse-bg 10s infinite alternate;
            z-index: -1;
        }

        @keyframes pulse-bg {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* 🍎 標題呼吸燈效果 */
        .title-brand {
            font-size: 3.5rem; font-weight: 900; text-align: center; letter-spacing: -3px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
            filter: drop-shadow(0 0 15px rgba(191,149,63,0.3));
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.2) drop-shadow(0 0 25px rgba(191,149,63,0.5)); }
        }

        /* 🧊 全維度統計卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 25px; text-align: center; backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stat-card:hover { transform: translateY(-10px); border-color: var(--eth-gold); box-shadow: 0 15px 40px var(--eth-glow); }
        .stat-value { font-size: 2rem; font-weight: 800; font-family: 'Montserrat'; margin-bottom: 5px; }
        .stat-label { font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase; }

        /* 🔍 智慧搜尋 */
        .search-input {
            width: 100%; padding: 22px 35px; border-radius: 50px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03); color: #fff; font-size: 1.1rem;
            backdrop-filter: blur(30px); outline: none; margin-bottom: 40px; box-sizing: border-box;
            transition: 0.4s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .search-input:focus { border-color: var(--eth-gold); background: rgba(255,255,255,0.07); box-shadow: 0 0 30px var(--eth-glow); }

        /* 💳 以太清單卡片 */
        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 32px;
            padding: 30px; margin-bottom: 25px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(40px); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        .key-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .key-card:hover { transform: scale(1.02); border-color: rgba(255,255,255,0.3); }
        .key-card.hidden { display: none; }

        .owner-info h2 { margin: 0 0 10px 0; font-size: 1.6rem; font-weight: 800; }
        .key-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
            background: rgba(191, 149, 63, 0.1); color: var(--eth-gold);
            border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
            border: 1px solid rgba(191,149,63,0.2); transition: 0.3s;
        }
        .key-badge:hover { background: var(--eth-gold); color: #000; }

        /* 🚀 側邊流動面板 (超感毛玻璃) */
        .detail-drawer {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 550px; height: 100vh;
            background: rgba(10, 15, 30, 0.7); backdrop-filter: blur(80px); -webkit-backdrop-filter: blur(80px);
            z-index: 2000; transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid var(--glass-border); box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .detail-drawer.active { right: 0; box-shadow: -30px 0 100px rgba(0,0,0,0.8); }

        .drawer-header { padding: 40px; padding-bottom: 20px; }
        .drawer-body { 
            flex: 1; overflow-y: auto; padding: 0 40px 40px 40px; 
            scrollbar-width: thin; scrollbar-color: var(--eth-gold) transparent;
        }
        .drawer-body::-webkit-scrollbar { width: 4px; }
        .drawer-body::-webkit-scrollbar-thumb { background: var(--eth-gold); border-radius: 10px; }

        /* 🍎 分類標籤 (Tabs) */
        .drawer-tabs { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 20px; }
        .tab-btn {
            flex: 1; padding: 14px; border: none; background: none; color: var(--text-secondary);
            font-size: 0.9rem; font-weight: 700; cursor: pointer; border-radius: 16px; transition: 0.4s;
        }
        .tab-btn.active { background: var(--gold-gradient); color: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

        /* 📊 數據組件 */
        .data-hero {
            background: linear-gradient(135deg, rgba(191,149,63,0.15) 0%, transparent 100%);
            border-radius: 30px; padding: 35px; border: 1px solid var(--glass-border);
            text-align: center; margin-bottom: 30px;
        }
        .revenue-val { font-size: 3.5rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .booking-row {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 20px;
            margin-bottom: 15px; border: 1px solid var(--glass-border); transition: 0.3s;
        }
        .booking-row:hover { background: rgba(255,255,255,0.06); border-color: var(--eth-gold); }

        /* 按鈕系統 */
        .btn-action {
            background: var(--gold-gradient); color: #000; border: none; border-radius: 18px;
            padding: 14px 28px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-action:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-del {
            background: rgba(255,0,0,0.1); color: #ff453a; border: 1px solid rgba(255,0,0,0.2);
            padding: 14px; border-radius: 18px; cursor: pointer; margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title-brand">AETHER MASTER</h1>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="count-total">--</div>
            <div class="stat-label">Total License</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="count-active" style="color:#32D74B">--</div>
            <div class="stat-label">Active Flow</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="count-warning" style="color:#FF9F0A">--</div>
            <div class="stat-label">Alert Status</div>
        </div>
    </div>

    <input type="text" id="search-bar" class="search-input" placeholder="🔍 搜尋店號、金鑰、或狀態..." onkeyup="filterKeys()">

    <div id="key-list"></div>
</div>

<div id="detail-drawer" class="detail-drawer">
    <div class="drawer-header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="drawer-title" style="margin:0; font-size:2rem; font-weight:900;">店家詳情</h2>
            <div class="drawer-close" onclick="closeDrawer()"><i class="fas fa-times"></i></div>
        </div>
        <p style="color:var(--text-secondary); margin-top:5px;">Real-time Synchronization Engine</p>
    </div>
    
    <div class="drawer-body">
        <div class="drawer-tabs">
            <button class="tab-btn active" id="tab-btn-stats" onclick="switchTab('stats')">營運數據</button>
            <button class="tab-btn" id="tab-btn-list" onclick="switchTab('list')">預約列表</button>
            <button class="tab-btn" id="tab-btn-raw" onclick="switchTab('raw')">完整存檔</button>
        </div>
        <div id="drawer-main-content"></div>
    </div>
</div>

<script>
    // --- Firebase 配置 ---
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentOpenKey = "";

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        try {
            const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
            let total = snap.size, active = 0, warning = 0, now = Date.now();
            listArea.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data(), keyId = doc.id;
                const isPermanent = !data.expire;
                let statusColor = "#32D74B", timeTxt = "👑 永久授權";

                if (!isPermanent) {
                    const days = Math.ceil((data.expire - now) / 86400000);
                    if (days <= 0) { statusColor = "#ff453a"; timeTxt = "❌ 已過期"; }
                    else { 
                        timeTxt = `⏳ ${days} 天`; active++;
                        if (days <= 7) { statusColor = "#FF9F0A"; warning++; }
                    }
                } else active++;

                const card = document.createElement('div');
                card.className = 'key-card';
                card.dataset.search = `${data.ownerName} ${data.salonId} ${keyId}`.toLowerCase();
                card.innerHTML = `
                    <div class="owner-info">
                        <h2>${data.ownerName || '未命名'}</h2>
                        <div class="key-badge" onclick="openDetail('${keyId}')"><i class="fas fa-fingerprint"></i> ${keyId}</div>
                        <p style="margin-top:15px; color:var(--text-secondary); font-size:0.9rem;">店號：${data.salonId || '---'}</p>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:${statusColor}; font-size:1.1rem; font-weight:800; margin-bottom:20px;">${timeTxt}</div>
                        <div style="display:flex;">
                            <button class="btn-action" onclick="modifyTime('${keyId}')">管理授權</button>
                            <button class="btn-del" onclick="deleteKey('${keyId}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
                listArea.appendChild(card);
            });
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-warning').innerText = warning;
        } catch (e) { console.error(e); }
    }

    async function openDetail(keyId) {
        currentOpenKey = keyId;
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        if (!doc.exists) return;
        const data = doc.data();
        document.getElementById('drawer-title').innerText = data.ownerName || '店家存檔';
        document.getElementById('detail-drawer').classList.add('active');
        switchTab('stats');
    }

    async function switchTab(tab) {
        const body = document.getElementById('drawer-main-content');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-btn-${tab}`).classList.add('active');
        
        body.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5;"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';

        const doc = await db.collection("LicenseKeys_Booking").doc(currentOpenKey).get();
        const data = doc.data();
        const salonId = data.salonId;

        try {
            const sSnap = await db.collection("Salons").doc(salonId).get();
            const appointments = sSnap.exists ? (sSnap.data().appointments || []) : [];

            if (tab === 'stats') {
                let rev = 0, services = {};
                appointments.forEach(a => {
                    if (a.done) rev += parseFloat(a.price || a.amount || 0);
                    let s = a.note || '其他項目';
                    services[s] = (services[s] || 0) + 1;
                });

                body.innerHTML = `
                    <div class="data-hero">
                        <p style="margin:0; font-size:0.8rem; color:var(--eth-gold); font-weight:800; letter-spacing:2px;">TOTAL REVENUE</p>
                        <div class="revenue-val">$${rev.toLocaleString()}</div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:30px;">
                        <div class="stat-card"><div class="stat-label">客次總量</div><div class="stat-value">${appointments.length}</div></div>
                        <div class="stat-card"><div class="stat-label">成交率</div><div class="stat-value">${Math.round((appointments.filter(a=>a.done).length/appointments.length)*100) || 0}%</div></div>
                    </div>
                    <h3>熱門服務排行</h3>
                    ${Object.entries(services).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n, c]) => `
                        <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span>${n}</span><span style="color:var(--eth-gold); font-weight:800;">${c} 次</span>
                        </div>
                    `).join('')}
                `;
            } else if (tab === 'list') {
                let list = '';
                [...appointments].reverse().forEach(a => {
                    list += `
                        <div class="booking-row">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <strong style="font-size:1.1rem;">${a.name || '客戶'}</strong>
                                <span style="color:#32D74B; font-weight:800;">$${a.price || 0}</span>
                            </div>
                            <div style="font-size:0.8rem; color:var(--text-secondary);">
                                日期：${a.date || '未註記'} <br> 備註：${a.note || '無'}
                            </div>
                        </div>
                    `;
                });
                body.innerHTML = list || '尚無預約明細';
            } else {
                let raw = '';
                for (const [k, v] of Object.entries(data)) {
                    let val = (v && v.toDate) ? v.toDate().toLocaleString() : v;
                    if (k === 'expire' && v) val = new Date(v).toLocaleString();
                    raw += `<div style="margin-bottom:20px;"><div style="color:var(--eth-gold); font-size:0.7rem; font-weight:800;">${k.toUpperCase()}</div><div style="font-size:1rem;">${val || 'null'}</div></div>`;
                }
                body.innerHTML = raw;
            }
        } catch (e) { body.innerHTML = "無法讀取該店營運數據，請確認店號是否正確綁定。"; }
    }

    function closeDrawer() { document.getElementById('detail-drawer').classList.remove('active'); }
    function filterKeys() {
        const kw = document.getElementById('search-bar').value.toLowerCase().trim();
        document.querySelectorAll('.key-card').forEach(c => {
            c.classList.toggle('hidden', !c.dataset.search.includes(kw));
        });
    }

    // 管理功能 - 補回自訂天數選項
    async function modifyTime(id) {
        const { value: mode } = await Swal.fire({
            title: '授權管理中心',
            background: 'rgba(10,15,30,0.98)',
            color: '#fff',
            input: 'select',
            inputOptions: {
                'add_30': '➕ 續約 30 天',
                'custom': '⌨️ 自訂天數',
                'to_forever': '💎 升級永久'
            },
            confirmButtonColor: '#BF953F',
            showCancelButton: true,
            cancelButtonText: '取消'
        });

        if (!mode) return;

        const doc = await db.collection("LicenseKeys_Booking").doc(id).get();
        const currentData = doc.data();
        const now = Date.now();
        // 基數時間：若已過期從現在算，未過期從到期日往後加
        let baseTime = (currentData.expire && currentData.expire > now) ? currentData.expire : now;
        let newExpire;

        if (mode === 'to_forever') {
            newExpire = null;
        } else if (mode === 'add_30') {
            newExpire = baseTime + (30 * 86400000);
        } else if (mode === 'custom') {
            const { value: days } = await Swal.fire({
                title: '請輸入天數',
                input: 'number',
                background: 'rgba(10,15,30,0.98)',
                color: '#fff',
                confirmButtonColor: '#BF953F',
                showCancelButton: true
            });
            if (days && parseInt(days) > 0) {
                newExpire = baseTime + (parseInt(days) * 86400000);
            } else {
                return;
            }
        }

        await db.collection("LicenseKeys_Booking").doc(id).update({ expire: newExpire });
        fetchKeys();
    }

    async function deleteKey(id) {
        if ((await Swal.fire({ title: '確認註銷？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ff453a', background: 'rgba(10,15,30,0.98)', color: '#fff' })).isConfirmed) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
