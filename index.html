<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦授權管理中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-deep: #050505;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fcf6ba 45%, #b38728 70%, #aa771c 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.4);
            --accent-green: #32D74B;
            --accent-orange: #FF9F0A;
            --accent-red: #FF453A;
        }

        /* 🌌 以太背景流動動畫 */
        @keyframes ether-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(191, 149, 63, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 850px; margin: 0 auto; }

        /* 🍎 賈伯斯標題：極簡、大器 */
        .title-brand { 
            font-size: 3.2rem; font-weight: 800; letter-spacing: -3px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 40px; text-align: center; filter: drop-shadow(0 0 20px rgba(191, 149, 63, 0.2));
        }

        /* 🧊 以太數據卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 50px; }
        .stat-card { 
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; 
            padding: 25px; text-align: center; backdrop-filter: blur(40px);
            transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
        .stat-value { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; font-family: 'Montserrat'; }
        .stat-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 3px; font-weight: 600; }

        /* 🔍 智慧搜尋框 */
        .search-container { margin-bottom: 40px; }
        .search-input {
            width: 100%; padding: 20px 30px; border-radius: 20px; 
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03);
            color: #fff; font-size: 1.1rem; backdrop-filter: blur(50px); outline: none; box-sizing: border-box;
            transition: all 0.5s ease;
        }
        .search-input:focus { background: rgba(255,255,255,0.06); border-color: #BF953F; box-shadow: 0 0 40px rgba(191, 149, 63, 0.1); }

        /* 💳 以太清單卡片 */
        .key-card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 30px; margin-bottom: 20px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(30px); transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .key-card:hover { transform: scale(1.02); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .key-card.hidden { display: none; }

        .owner-name { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px; }
        .key-id-badge { 
            font-size: 0.75rem; color: #BF953F; background: rgba(191,149,63,0.1); 
            padding: 6px 14px; border-radius: 12px; font-family: 'Montserrat';
            cursor: pointer; border: 1px solid rgba(191,149,63,0.1); transition: 0.3s;
        }
        .key-id-badge:hover { background: rgba(191,149,63,0.2); border-color: rgba(191,149,63,0.3); }

        .progress-track { width: 100%; height: 5px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }

        /* 側邊抽屜 - 毛玻璃巔峰 */
        .detail-drawer {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 500px; height: 100vh;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px);
            z-index: 2000; transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid var(--glass-border); padding: 70px 40px; box-sizing: border-box;
        }
        .detail-drawer.active { right: 0; }
        .drawer-close { position: absolute; top: 40px; right: 40px; color: var(--text-dim); font-size: 1.8rem; cursor: pointer; transition: 0.3s; }
        .drawer-close:hover { color: #fff; transform: scale(1.1); }

        /* 🍎 分頁標籤樣式 */
        .drawer-tabs { display: flex; gap: 8px; margin-bottom: 40px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 18px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim);
            font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 14px; transition: 0.4s;
        }
        .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

        /* 📊 數據統計裝飾 */
        .hero-stats {
            background: linear-gradient(135deg, rgba(191,149,63,0.1) 0%, transparent 100%);
            border-radius: 28px; padding: 30px; text-align: center; border: 1px solid var(--glass-border); margin-bottom: 30px;
        }
        .hero-value { font-size: 3rem; font-weight: 800; color: #fff; margin: 10px 0; font-family: 'Montserrat'; letter-spacing: -2px; }

        .booking-item {
            background: rgba(255, 255, 255, 0.02); border-radius: 20px; padding: 20px; margin-bottom: 15px;
            border: 1px solid var(--glass-border); transition: 0.3s;
        }
        .booking-item:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(191, 149, 63, 0.3); }

        /* 物理效果按鈕 */
        .btn-renew-luxe {
            background: var(--gold-gradient); color: #000 !important; border: none; border-radius: 16px;
            padding: 12px 24px; font-weight: 800; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(191, 149, 63, 0.2);
        }
        .btn-renew-luxe:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(191, 149, 63, 0.3); }
        .btn-trash { 
            background: rgba(255, 69, 58, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 69, 58, 0.2);
            border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.3s; margin-left: 10px;
        }
        .btn-trash:hover { background: rgba(255, 69, 58, 0.2); transform: scale(1.1); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title-brand">AETHER MASTER</h1>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="count-total">--</div>
            <div class="stat-label">Total License</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="count-active" style="color: var(--accent-green)">--</div>
            <div class="stat-label">Active Flow</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="count-warning" style="color: var(--accent-orange)">--</div>
            <div class="stat-label">Attention</div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="Search keys, salons, or status..." onkeyup="filterKeys()">
    </div>

    <div id="key-list"></div>
</div>

<div id="detail-drawer" class="detail-drawer">
    <div class="drawer-close" onclick="closeDrawer()"><i class="fas fa-times"></i></div>
    <div class="drawer-title" id="drawer-owner-title">店家詳情</div>
    <div class="drawer-subtitle">Operational Analysis</div>
    
    <div id="drawer-content">
        </div>
</div>

<script>
    // --- Firebase 配置 (維持不變) ---
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 主清單讀取 ---
    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        try {
            const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
            let total = snap.size, active = 0, warning = 0, now = Date.now();
            listArea.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data(), keyId = doc.id;
                const isPermanent = !data.expire;
                let timeText = "👑 永久授權", color = varName('--accent-green'), progress = 100, isExpired = false;

                if (!isPermanent) {
                    const days = Math.ceil((data.expire - now) / 86400000);
                    progress = Math.max(0, Math.min(100, (days / 30) * 100));
                    if (days <= 0) { timeText = "❌ 已過期"; color = varName('--accent-red'); isExpired = true; }
                    else { 
                        timeText = `⏳ 剩餘 ${days} 天`; 
                        active++;
                        if (days <= 7) { color = varName('--accent-orange'); warning++; }
                    }
                } else active++;

                const card = document.createElement('div');
                card.className = `key-card ${isExpired ? 'is-expired' : ''}`;
                card.dataset.search = `${data.ownerName} ${data.salonId} ${keyId}`.toLowerCase();
                card.innerHTML = `
                    <div style="flex:1">
                        <div class="owner-name">${data.ownerName || '未命名店家'}</div>
                        <div class="key-id-badge" onclick="openDetail('${keyId}')"><i class="fas fa-key"></i> ${keyId}</div>
                        <div class="progress-track"><div class="progress-fill" style="width:${progress}%; background:${color}"></div></div>
                        <div style="font-size:0.8rem; color:var(--text-dim)">店號：${data.salonId || '---'}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="color:${color}; font-weight:800; margin-bottom:15px; font-size:0.9rem;">${timeText}</div>
                        <div style="display:flex; align-items:center">
                            <button class="btn-renew-luxe" onclick="modifyTime('${keyId}')">管理</button>
                            <button class="btn-trash" onclick="deleteKey('${keyId}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
                listArea.appendChild(card);
            });
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-warning').innerText = warning;
        } catch (e) { console.error(e); }
    }

    // --- 詳情抽屜引擎 (數據分析 + 分類) ---
    async function openDetail(keyId) {
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        if (!doc.exists) return;
        const data = doc.data();
        document.getElementById('drawer-owner-title').innerText = data.ownerName || '店家詳算';
        
        const content = document.getElementById('drawer-content');
        content.innerHTML = `
            <div class="drawer-tabs">
                <button class="tab-btn active" id="btn-stats" onclick="switchTab('stats', '${keyId}')">數據統計</button>
                <button class="tab-btn" id="btn-list" onclick="switchTab('list', '${keyId}')">預約列表</button>
            </div>
            <div id="drawer-main-body">正在連線以太網路...</div>
        `;
        document.getElementById('detail-drawer').classList.add('active');
        switchTab('stats', keyId);
    }

    async function switchTab(tab, keyId) {
        const body = document.getElementById('drawer-main-body');
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        const salonId = doc.data().salonId;

        // 切換按鈕樣式
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${tab}`).classList.add('active');

        try {
            const sSnap = await db.collection("Salons").doc(salonId).get();
            const apps = sSnap.exists ? (sSnap.data().appointments || []) : [];

            if (tab === 'stats') {
                let revenue = 0;
                let serviceMap = {};
                apps.forEach(a => {
                    if (a.done) revenue += parseFloat(a.price || a.amount || 0);
                    let s = a.note || '一般項目';
                    serviceMap[s] = (serviceMap[s] || 0) + 1;
                });

                body.innerHTML = `
                    <div class="hero-stats">
                        <div style="font-size:0.7rem; color:var(--accent-green); letter-spacing:2px; font-weight:800;">TOTAL REVENUE</div>
                        <div class="hero-value">$${revenue.toLocaleString()}</div>
                        <div style="font-size:0.8rem; color:var(--text-dim)">透過 Aether 完成了 ${apps.filter(a=>a.done).length} 筆訂單</div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:30px;">
                        <div class="stat-card" style="padding:15px">
                            <div style="font-size:0.6rem; color:var(--text-dim)">總客流量</div>
                            <div style="font-size:1.4rem; font-weight:800;">${apps.length}</div>
                        </div>
                        <div class="stat-card" style="padding:15px">
                            <div style="font-size:0.6rem; color:var(--text-dim)">熱門程度</div>
                            <div style="font-size:1.4rem; font-weight:800; color:var(--accent-orange)">${Object.keys(serviceMap).length} 項</div>
                        </div>
                    </div>
                    <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:15px; font-weight:800;">TOP SERVICES</div>
                    ${Object.entries(serviceMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n, c]) => `
                        <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05)">
                            <span style="font-size:0.9rem;">${n}</span>
                            <span style="color:#BF953F; font-weight:700;">${c} 次</span>
                        </div>
                    `).join('')}
                `;
            } else {
                let listHtml = apps.length ? '' : '<div style="color:var(--text-dim); text-align:center; padding:40px;">無預約紀錄</div>';
                [...apps].reverse().forEach(a => {
                    listHtml += `
                        <div class="booking-item">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span style="font-weight:700;">${a.name || '客戶'}</span>
                                <span style="color:var(--accent-green); font-weight:800;">$${a.price || 0}</span>
                            </div>
                            <div style="font-size:0.75rem; color:var(--text-dim);">
                                <i class="far fa-calendar-alt"></i> ${a.date || '未註記日期'} <br>
                                <i class="fas fa-pen-nib"></i> ${a.note || '無備註'}
                            </div>
                        </div>
                    `;
                });
                body.innerHTML = listHtml;
            }
        } catch (e) { body.innerHTML = "無法讀取雲端數據"; }
    }

    // 工具函式
    function varName(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }
    function closeDrawer() { document.getElementById('detail-drawer').classList.remove('active'); }
    function filterKeys() {
        const kw = document.getElementById('search-bar').value.toLowerCase().trim();
        document.querySelectorAll('.key-card').forEach(c => {
            c.classList.toggle('hidden', !c.dataset.search.includes(kw));
        });
    }

    // 管理功能 (維持原本強大的 Firebase 邏輯)
    async function modifyTime(id) {
        const { value: m } = await Swal.fire({
            title: 'License Control', background: 'rgba(10,10,10,0.95)', color: '#fff',
            input: 'select', inputOptions: { 'add_30': '➕ Renew 30 Days', 'to_forever': '💎 Upgrade to Forever' },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (!m) return;
        const doc = await db.collection("LicenseKeys_Booking").doc(id).get();
        const cur = doc.data().expire, now = Date.now();
        let base = (cur && cur > now) ? cur : now, expire = (m === 'to_forever') ? null : base + (30 * 86400000);
        await db.collection("LicenseKeys_Booking").doc(id).update({ expire });
        fetchKeys();
    }

    async function deleteKey(id) {
        if ((await Swal.fire({ title: 'Confirm Deletion?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#FF453A', background: 'rgba(10,10,10,0.95)', color: '#fff' })).isConfirmed) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
