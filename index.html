<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 權限編輯中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --gold: #D4AF37;
            --silver: #C0C0C0;
            --danger: #FF453A;
            --success: #32D74B;
            --glass: rgba(255, 255, 255, 0.05);
            --edit: #0A84FF;
        }

        body { 
            background: #000; color: #fff; 
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif; 
            margin: 0; padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 850px; margin: 0 auto; }
        
        /* 數據看板 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-value { font-size: 1.5rem; font-weight: 900; margin-bottom: 5px; }
        .stat-label { font-size: 0.7rem; color: #888; font-weight: 700; letter-spacing: 1px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: #fff; }
        .btn-create { background: #fff; color: #000; border: none; padding: 10px 25px; border-radius: 50px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-create:active { transform: scale(0.95); }

        /* 鑰匙卡片 */
        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(20px);
            transition: 0.3s;
        }
        .card:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }

        .tag { font-size: 0.7rem; padding: 4px 12px; border-radius: 8px; font-weight: 900; margin-bottom: 8px; display: inline-block; letter-spacing: 1px; }
        .tag-admin { background: var(--gold); color: #000; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2); }
        .tag-staff { background: var(--silver); color: #000; box-shadow: 0 4px 10px rgba(192, 192, 192, 0.2); }

        .key-title { font-family: monospace; font-size: 1.2rem; color: #fff; font-weight: 800; letter-spacing: 1px; }
        .key-sub { font-size: 0.8rem; color: #aaa; margin-top: 6px; font-weight: 500; }
        .time-left { font-size: 0.75rem; font-weight: 700; margin-top: 6px; }

        .controls { display: flex; align-items: center; }
        .controls i { font-size: 1.3rem; margin-left: 22px; cursor: pointer; transition: 0.2s; padding: 5px; }
        
        .fa-pen-to-square { color: var(--edit); }
        .fa-lock-open { color: var(--success); text-shadow: 0 0 10px rgba(50, 215, 75, 0.3); }
        .fa-lock { color: var(--danger); text-shadow: 0 0 10px rgba(255, 69, 58, 0.3); }
        .fa-trash { color: #444; }
        .fa-trash:hover { color: var(--danger); }

        .swal2-input-custom {
            background: #111 !important; color: #fff !important;
            border: 1px solid #333 !important; border-radius: 12px !important;
            margin: 10px 0 !important; width: 90% !important; padding: 15px !important;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">AETHER MASTER <span style="font-size: 0.7rem; color: var(--edit);">v4.5</span></div>
        <button class="btn-create" onclick="openKeyModal()">＋ 生成密鑰</button>
    </div>

    <!-- 實時數據看板 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div id="stat-total" class="stat-value">0</div>
            <div class="stat-label">總授權數</div>
        </div>
        <div class="stat-card">
            <div id="stat-admin" class="stat-value" style="color: var(--gold);">0</div>
            <div class="stat-label">金鑰匙</div>
        </div>
        <div class="stat-card">
            <div id="stat-staff" class="stat-value" style="color: var(--silver);">0</div>
            <div class="stat-label">副鑰匙</div>
        </div>
        <div class="stat-card">
            <div id="stat-blocked" class="stat-value" style="color: var(--danger);">0</div>
            <div class="stat-label">已斷電</div>
        </div>
    </div>

    <div id="loading" style="text-align:center; color:#444; padding: 40px;">📡 連線雲端資料庫中...</div>
    <div id="key-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function startSync() {
        db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").onSnapshot(snap => {
            document.getElementById('loading').style.display = 'none';
            const list = document.getElementById('key-list');
            list.innerHTML = '';
            
            let stats = { total: 0, admin: 0, staff: 0, blocked: 0 };

            snap.forEach(doc => {
                const data = doc.data();
                renderCard(doc.id, data);
                
                // 統計數據
                stats.total++;
                if (data.status === 'blocked') stats.blocked++;
                if (data.role === 'admin') stats.admin++;
                else stats.staff++;
            });

            // 更新看板數據
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-admin').innerText = stats.admin;
            document.getElementById('stat-staff').innerText = stats.staff;
            document.getElementById('stat-blocked').innerText = stats.blocked;
        });
    }

    function renderCard(id, data) {
        const list = document.getElementById('key-list');
        const isBlocked = data.status === 'blocked';
        let timeDisplay = data.expire ? calculateRemain(data.expire) : "♾️ 永久授權";

        const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(data))));

        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div>
                <span class="tag ${data.role === 'admin' ? 'tag-admin' : 'tag-staff'}">
                    ${data.role === 'admin' ? '金鑰匙' : '副鑰匙'}
                </span>
                <div class="key-title">${id}</div>
                <div class="key-sub">店號: <span style="color:#fff">${data.salonId}</span> | 名稱: <span style="color:#fff">${data.ownerName}</span></div>
                <div class="time-left" style="color:${timeDisplay.includes('過期') ? 'var(--danger)' : '#32D74B'}">${timeDisplay}</div>
            </div>
            <div class="controls">
                <i class="fa-solid fa-pen-to-square" title="修改" onclick="handleEditClick('${id}', '${dataStr}')"></i>
                <i class="fas ${isBlocked ? 'fa-lock' : 'fa-lock-open'}" title="${isBlocked ? '點擊通電' : '點擊斷電'}" onclick="toggleStatus('${id}', '${data.status}')"></i>
                <i class="fas fa-trash" title="刪除" onclick="deleteKey('${id}')"></i>
            </div>
        `;
        list.appendChild(div);
    }

    function calculateRemain(expire) {
        const remain = expire - Date.now();
        if (remain <= 0) return "❌ 授權已過期";
        const d = Math.floor(remain / 86400000);
        const h = Math.floor((remain % 86400000) / 3600000);
        const m = Math.floor((remain % 3600000) / 60000);
        return `⏳ 剩餘 ${d}天 ${h}時 ${m}分`;
    }

    function handleEditClick(id, encodedData) {
        const data = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
        openKeyModal(id, data);
    }

    async function openKeyModal(existingId = null, existingData = null) {
        const isEdit = !!existingId;
        const { value: form } = await Swal.fire({
            title: isEdit ? '修改密鑰權限' : '發放全新密鑰',
            background: '#000', color: '#fff',
            confirmButtonColor: '#fff',
            confirmButtonText: '<span style="color:#000;font-weight:800">儲存並同步</span>',
            html: `
                <select id="swal-role" class="swal2-input-custom">
                    <option value="admin" ${isEdit && existingData.role==='admin'?'selected':''}>👑 金鑰匙 (最高權限)</option>
                    <option value="staff" ${isEdit && existingData.role==='staff'?'selected':''}>👤 副鑰匙 (限制裝置)</option>
                </select>
                <input id="swal-shop" placeholder="店號 (例如: VIP888)" class="swal2-input-custom" value="${isEdit?existingData.salonId:''}">
                <input id="swal-name" placeholder="對象名稱 (例如: 店長手機)" class="swal2-input-custom" value="${isEdit?existingData.ownerName:''}">
                <div style="display:flex; justify-content:center; gap:10px; width:90%; margin:0 auto;">
                    <input id="swal-num" type="number" class="swal2-input-custom" style="width:50% !important;" placeholder="${isEdit?'重設時限數字':'預設30'}">
                    <select id="swal-unit" class="swal2-input-custom" style="width:50% !important;">
                        <option value="day">天數</option>
                        <option value="hr">小時</option>
                        <option value="min">分鐘</option>
                        <option value="inf" ${isEdit && !existingData.expire?'selected':''}>無限/永久</option>
                    </select>
                </div>
            `,
            showCancelButton: true,
            cancelButtonText: '取消',
            preConfirm: () => ({
                role: document.getElementById('swal-role').value,
                shop: document.getElementById('swal-shop').value.toUpperCase(),
                name: document.getElementById('swal-name').value,
                num: document.getElementById('swal-num').value,
                unit: document.getElementById('swal-unit').value
            })
        });

        if (form) {
            let expireAt = isEdit ? existingData.expire : null;
            if (form.num && form.unit !== 'inf') {
                const multiplier = form.unit === 'day' ? 86400000 : (form.unit === 'hr' ? 3600000 : 60000);
                expireAt = Date.now() + (form.num * multiplier);
            } else if (form.unit === 'inf') {
                expireAt = null;
            }

            const payload = {
                role: form.role,
                salonId: form.shop || "GLOBAL",
                ownerName: form.name || "新裝置",
                expire: expireAt,
                updatedAt: Date.now()
            };

            if (isEdit) {
                await db.collection("LicenseKeys_Booking").doc(existingId).update(payload);
                Swal.fire({ title: '同步成功', icon: 'success', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false, background: '#000', color: '#fff' });
            } else {
                const newId = "BK-" + Math.random().toString(36).substring(2, 10).toUpperCase();
                payload.status = "unused";
                payload.createdAt = Date.now();
                await db.collection("LicenseKeys_Booking").doc(newId).set(payload);
                Swal.fire({ title: '已生成：' + newId, icon: 'success', background: '#000', color: '#fff' });
            }
        }
    }

    async function toggleStatus(id, current) {
        const next = current === 'blocked' ? 'used' : 'blocked';
        await db.collection("LicenseKeys_Booking").doc(id).update({ status: next });
    }

    async function deleteKey(id) {
        const result = await Swal.fire({
            title: '確定移除此授權？',
            text: "此動作將使該裝置永久斷電！",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#FF453A',
            confirmButtonText: '確定刪除',
            cancelButtonText: '取消',
            background: '#000', color: '#fff'
        });

        if (result.isConfirmed) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
        }
    }

    startSync();
</script>
</body>
</html>
