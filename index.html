<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦授權管理中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        body {
            background: var(--bg-deep);
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            background: radial-gradient(circle at top right, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; }
        .title-brand { 
            font-family: 'Montserrat', sans-serif; font-size: 2.8rem; font-weight: 800; letter-spacing: -2px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 🚀 搜尋列樣式 */
        .search-container {
            margin: 20px 0;
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        .search-input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(20px);
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .search-input:focus {
            border-color: #BF953F;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(191, 149, 63, 0.3);
        }

        /* 統計與卡片樣式維持原樣 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 25px 0 40px; }
        .stat-card { background: var(--glass); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(20px); }
        .stat-value { font-size: 1.8rem; font-weight: 900; }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 2px; }

        .key-card {
            background: var(--glass); border: 1px solid var(--card-border); border-radius: 24px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(30px); transition: 0.3s;
        }
        .key-card.hidden { display: none; } /* 用於搜尋過濾 */

        .owner-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; cursor: pointer; color: #fff; }
        .key-id-badge { font-family: 'Montserrat'; font-size: 0.65rem; color: var(--text-dim); background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 5px; }
        
        .detail-row { display: flex; gap: 20px; margin-top: 15px; font-size: 0.85rem; color: var(--text-dim); }
        .detail-item strong { color: #BF953F; }

        .status-box { text-align: right; min-width: 180px; }
        .time-badge { font-size: 0.9rem; font-weight: 800; padding: 8px 15px; border-radius: 12px; margin-bottom: 15px; display: inline-block; background: rgba(212,175,55,0.12); color: #FCF6BA; }
        
        .btn-renew-luxe {
            background: var(--gold-gradient); color: #000 !important; border: none; border-radius: 12px;
            padding: 8px 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title-brand">AETHER MASTER</h1>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="count-total">--</div><div class="stat-label">總授權</div></div>
            <div class="stat-card"><div class="stat-value" id="count-active" style="color:#34C759">--</div><div class="stat-label">運行中</div></div>
            <div class="stat-card"><div class="stat-value" id="count-warning" style="color:#FF9F0A">--</div><div class="stat-label">即將過期</div></div>
        </div>

        <div class="search-container">
            <input type="text" id="search-bar" class="search-input" placeholder="🔍 輸入店號或顧客名稱快速搜尋..." onkeyup="filterKeys()">
        </div>
    </div>

    <div id="key-list"></div>
</div>

<script>
    // Firebase Config (請保持原樣)
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        try {
            const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
            let total = snap.size, active = 0, warning = 0, now = new Date().getTime();
            listArea.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data(), keyId = doc.id;
                let displayDate = data.activatedAt ? data.activatedAt.toDate().toLocaleDateString() : '未激活';
                const isPermanent = !data.expire;
                let timeText = "👑 永久授權", isExpired = false;

                if (!isPermanent) {
                    const diff = data.expire - now;
                    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    if (diff <= 0) { timeText = "❌ 已過期"; isExpired = true; }
                    else { timeText = `⏳ 剩餘 ${days} 天`; active++; if (days <= 7) warning++; }
                } else active++;

                const card = document.createElement('div');
                card.className = 'key-card';
                // 🚀 關鍵：在 dataset 存入搜尋用的關鍵字
                card.dataset.search = `${data.ownerName || ''} ${data.salonId || ''}`.toLowerCase();
                
                card.innerHTML = `
                    <div style="flex:1;">
                        <div class="owner-name" onclick="editOwner('${keyId}', '${data.ownerName || ''}')">
                            <i class="fas fa-edit" style="font-size:0.8rem; opacity:0.3;"></i> ${data.ownerName || '未命名'}
                        </div>
                        <div class="key-id-badge">ID: ${keyId}</div>
                        <div class="detail-row">
                            <div class="detail-item"><strong>店號：</strong> ${data.salonId || '等待綁定'}</div>
                            <div class="detail-item"><strong>激活：</strong> ${displayDate}</div>
                        </div>
                    </div>
                    <div class="status-box">
                        <div class="time-badge ${isExpired ? 'bg-expired' : ''}">${timeText}</div>
                        <div class="btn-group">
                            <button class="btn-renew-luxe" onclick="modifyTime('${keyId}')">
                                <i class="fas fa-calendar-plus"></i> 續約
                            </button>
                        </div>
                    </div>
                `;
                listArea.appendChild(card);
            });
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-warning').innerText = warning;
        } catch (e) { listArea.innerHTML = "數據讀取失敗"; }
    }

    // 🚀 搜尋過濾功能
    function filterKeys() {
        const keyword = document.getElementById('search-bar').value.toLowerCase();
        const cards = document.querySelectorAll('.key-card');
        
        cards.forEach(card => {
            const searchText = card.dataset.search;
            if (searchText.includes(keyword)) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    // 續約與編輯功能保持原樣 (同上一版本)
    async function modifyTime(keyId) {
        const { value: mode } = await Swal.fire({
            title: '授權管理', background: '#1a1a1a', color: '#fff',
            input: 'select',
            inputOptions: { 'add_30': '➕ 續約 30 天', 'custom': '⌨️ 自定義天數', 'to_forever': '💎 升級永久' },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (!mode) return;
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        const currentExpire = doc.data().expire;
        const now = new Date().getTime();
        let baseTime = (currentExpire && currentExpire > now) ? currentExpire : now;
        let newExpire = null;

        if (mode === 'to_forever') newExpire = null;
        else {
            let addDays = (mode === 'add_30') ? 30 : 0;
            if (mode === 'custom') {
                const { value: cDays } = await Swal.fire({ title: '增加幾天？', input: 'number', background: '#1a1a1a', color: '#fff' });
                addDays = parseInt(cDays);
            }
            if (addDays > 0) newExpire = baseTime + (addDays * 24 * 60 * 60 * 1000);
            else return;
        }
        await db.collection("LicenseKeys_Booking").doc(keyId).update({ expire: newExpire });
        fetchKeys();
    }

    async function editOwner(keyId, currentName) {
        const { value: newName } = await Swal.fire({
            title: '編輯備註', input: 'text', inputValue: currentName,
            background: '#1a1a1a', color: '#fff', confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (newName !== undefined) {
            await db.collection("LicenseKeys_Booking").doc(keyId).update({ ownerName: newName });
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
