<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-gold: #BF953F;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
            --danger: #ff453a;
        }

        body { background: #000; margin: 0; padding: 20px; font-family: 'Montserrat', 'Noto Sans TC', sans-serif; color: #fff; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .title-brand { font-size: 2.2rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .btn-add-main { background: var(--gold-gradient); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px rgba(191,149,63,0.3); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(20px); }
        .stat-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.7rem; opacity: 0.5; }

        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(40px); transition: 0.3s;
        }
        .key-card:hover { border-color: var(--eth-gold); }
        
        .name-container { cursor: pointer; }
        .editable-name { color: #fff; margin: 0; font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .editable-name i { font-size: 0.8rem; opacity: 0.3; }

        /* 裝置清單樣式 */
        .device-tag { font-size: 0.75rem; color: #aaa; margin-top: 5px; display: flex; align-items: center; gap: 6px; }
        .device-tag i { color: var(--eth-gold); font-size: 0.8rem; }
        .device-time { font-size: 0.65rem; opacity: 0.5; margin-left: 4px; }

        .btn-action { background: var(--gold-gradient); color: #000; border: none; border-radius: 15px; padding: 12px 25px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-del { color: var(--danger); margin-left: 20px; cursor: pointer; opacity: 0.4; }
        
        #loading-view { text-align: center; padding: 50px; color: var(--eth-gold); font-weight: 900; }
        .salon-id-badge { color: var(--eth-gold); font-weight: 800; margin-top: 5px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 class="title-brand">AETHER MASTER</h1>
        <button class="btn-add-main" onclick="createNewShop()"><i class="fas fa-plus"></i> 生成新授權</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="count-total">--</span><span class="stat-label">授權總數</span></div>
        <div class="stat-card"><span class="stat-val" id="count-active" style="color:#32D74B">--</span><span class="stat-label">正常運行</span></div>
        <div class="stat-card"><span class="stat-val" id="count-blocked" style="color:#ff453a">--</span><span class="stat-label">已封鎖</span></div>
    </div>

    <div id="loading-view">📡 正在同步雲端橋樑數據...</div>
    <div id="key-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allKeysCache = {}; 

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        const loading = document.getElementById('loading-view');
        
        try {
            const snapKeys = await db.collection("LicenseKeys_Booking").get();
            loading.style.display = 'none';
            listArea.innerHTML = '';
            allKeysCache = {};

            let items = [];
            snapKeys.forEach(doc => {
                let data = doc.data();
                data._id = doc.id;
                items.push(data);
            });

            items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            let activeCount = 0, blockCount = 0;
            const now = Date.now();

            items.forEach(data => {
                const keyId = data._id;
                allKeysCache[keyId] = data;
                if(data.status === 'blocked') blockCount++; else activeCount++;

                let timeTxt = "👑 永久授權", statusColor = "#32D74B";
                if (data.expire) {
                    const days = Math.ceil((data.expire - now) / 86400000);
                    if (days <= 0) { timeTxt = "❌ 已屆滿"; statusColor = "#ff453a"; }
                    else { timeTxt = `⏳ 剩餘 ${days} 天`; if(days <= 7) statusColor = "#FF9F0A"; }
                }

                // 🚀 多裝置顯示邏輯
                let devicesHtml = '';
                if (data.devices && typeof data.devices === 'object') {
                    Object.keys(data.devices).forEach(dId => {
                        const d = data.devices[dId];
                        const dTime = new Date(d.lastSeen).toLocaleString('zh-TW', {hour12:false, month:'numeric', day:'numeric', hour:'numeric', minute:'numeric'});
                        devicesHtml += `
                            <div class="device-tag">
                                <i class="fas fa-mobile-alt"></i> ${d.model} <span class="device-time">(${dTime})</span>
                            </div>`;
                    });
                } else {
                    devicesHtml = '<div class="device-tag" style="opacity:0.3">尚未偵測到登入裝置</div>';
                }

                const card = document.createElement('div');
                card.className = 'key-card';
                card.innerHTML = `
                    <div style="flex:1">
                        <div class="name-container" onclick="editDisplayName('${keyId}', '${data.ownerName || ''}')">
                            <h2 class="editable-name">${data.ownerName || '未命名'} <i class="fas fa-pen"></i></h2>
                        </div>
                        <div class="salon-id-badge">ID：${data.salonId}</div>
                        <div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px;">
                            ${devicesHtml}
                        </div>
                    </div>
                    <div style="text-align:right; margin-left:15px;">
                        <div style="color:${data.status === 'blocked' ? '#ff453a' : statusColor}; font-weight:900; margin-bottom:15px;">
                            ${data.status === 'blocked' ? '🚫 已封鎖' : timeTxt}
                        </div>
                        <div style="display:flex; align-items:center; justify-content:flex-end;">
                            <button class="btn-action" onclick="manageLicense('${keyId}')">管理</button>
                            <i class="fas fa-trash btn-del" onclick="deleteKey('${keyId}')"></i>
                        </div>
                    </div>
                `;
                listArea.appendChild(card);
            });

            document.getElementById('count-total').innerText = items.length;
            document.getElementById('count-active').innerText = activeCount;
            document.getElementById('count-blocked').innerText = blockCount;

        } catch (e) {
            loading.innerHTML = "❌ 同步失敗: " + e.message;
        }
    }

    async function editDisplayName(docId, currentName) {
        const { value: newName } = await Swal.fire({
            title: '修改備註名稱',
            input: 'text',
            inputValue: currentName,
            background: '#121212', color: '#fff',
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (newName !== undefined) {
            await db.collection("LicenseKeys_Booking").doc(docId).update({ ownerName: newName });
            fetchKeys();
        }
    }

    async function manageLicense(id) {
        const data = allKeysCache[id];
        const { value: mode } = await Swal.fire({
            title: '授權管理',
            input: 'select',
            inputOptions: { 'append': '🟢 續約 (加天數)', 'forever': '👑 永久版', 'block': '🚫 封鎖', 'active': '✅ 解鎖' },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (!mode) return;

        if (mode === 'block' || mode === 'active') {
            const s = (mode === 'block') ? 'blocked' : 'active';
            await db.collection("LicenseKeys_Booking").doc(id).update({ status: s });
            await db.collection("Salons").doc(data.salonId).update({ status: s }).catch(()=>{});
        } else if (mode === 'forever') {
            await updateLicense(id, data.salonId, null);
        } else {
            const { value: days } = await Swal.fire({ title: '天數', input: 'number' });
            if (days) {
                let base = (data.expire > Date.now()) ? data.expire : Date.now();
                await updateLicense(id, data.salonId, base + (parseInt(days) * 86400000));
            }
        }
        fetchKeys();
    }

    async function updateLicense(keyId, salonId, exp) {
        await db.collection("LicenseKeys_Booking").doc(keyId).update({ expire: exp, status: 'active' });
        await db.collection("Salons").doc(salonId).set({ expiryDate: exp, status: 'active' }, { merge: true });
    }

    async function createNewShop() {
        const { value: f } = await Swal.fire({
            title: '生成新授權',
            html: '<input id="sw-n" class="swal2-input" placeholder="備註名稱"><input id="sw-i" class="swal2-input" placeholder="正確店號">',
            background: '#121212', color: '#fff',
            confirmButtonColor: '#BF953F',
            preConfirm: () => ({ n: document.getElementById('sw-n').value, i: document.getElementById('sw-i').value })
        });
        if (f && f.i) {
            await db.collection("LicenseKeys_Booking").add({
                ownerName: f.n, salonId: f.i, status: "active", createdAt: Date.now(), expire: null
            });
            fetchKeys();
        }
    }

    async function deleteKey(id) {
        if (confirm("確定刪除此授權？(不會刪除營業資料)")) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
