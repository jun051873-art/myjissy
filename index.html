<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 旗艦授權管理中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        /* 🚀 呼吸光暈動畫 (新用戶專屬) */
        @keyframes gold-pulse {
            0% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.1); border-color: rgba(255,255,255,0.1); }
            50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); border-color: #BF953F; }
            100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.1); border-color: rgba(255,255,255,0.1); }
        }

        body {
            background: var(--bg-deep);
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            background: radial-gradient(circle at top right, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; }
        .title-brand { 
            font-family: 'Montserrat', sans-serif; font-size: 2.8rem; font-weight: 800; letter-spacing: -2px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .search-container { margin: 20px 0 30px; position: sticky; top: 10px; z-index: 1000; }
        .search-input {
            width: 100%; padding: 18px 30px; border-radius: 50px; 
            border: 1px solid rgba(191, 149, 63, 0.3);
            background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 1.1rem; 
            backdrop-filter: blur(30px); outline: none; box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .search-input:focus { border-color: #FCF6BA; box-shadow: 0 0 25px rgba(191, 149, 63, 0.4); transform: scale(1.01); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 25px 0 40px; }
        .stat-card { background: var(--glass); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(20px); }
        .stat-value { font-size: 1.8rem; font-weight: 900; }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 2px; }

        .key-card {
            background: var(--glass); border: 1px solid var(--card-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(30px); transition: 0.4s;
        }
        .key-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.06); }
        .key-card.is-new { animation: gold-pulse 3s infinite; }
        .key-card.is-expired { filter: grayscale(0.6); opacity: 0.7; border-color: rgba(255, 59, 48, 0.3) !important; }
        .key-card.hidden { display: none; }

        /* 🚀 動態進度條 */
        .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin: 15px 0 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 1s ease; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .owner-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 10px; }
        .role-badge { font-size: 0.65rem; font-weight: 900; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .role-admin { background: rgba(191, 149, 63, 0.2); color: #FCF6BA; border: 1px solid #BF953F; }
        .role-staff { background: rgba(255, 255, 255, 0.1); color: #aaa; }

        .key-id-badge { font-family: 'Montserrat'; font-size: 0.65rem; color: var(--text-dim); background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 5px; }
        .detail-row { display: flex; gap: 20px; margin-top: 10px; font-size: 0.85rem; color: var(--text-dim); }
        .detail-item strong { color: #BF953F; }

        .status-box { text-align: right; min-width: 180px; }
        .time-badge { font-size: 0.9rem; font-weight: 800; padding: 8px 15px; border-radius: 12px; margin-bottom: 15px; display: inline-block; }
        
        .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-remind { background: rgba(52, 199, 89, 0.1); color: #34C759; border: 1px solid rgba(52, 199, 89, 0.3); padding: 8px 12px; border-radius: 10px; font-weight: 900; cursor: pointer; }
        .quick-plus-btn { background: rgba(212,175,55,0.1); color: #FCF6BA; border: 1px solid rgba(212,175,55,0.3); padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 900; cursor: pointer; }
        .btn-renew-luxe { background: var(--gold-gradient); color: #000 !important; border: none; border-radius: 10px; padding: 8px 15px; font-weight: 900; cursor: pointer; }
        .btn-trash { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title-brand">AETHER MASTER</h1>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="count-total">--</div><div class="stat-label">總授權</div></div>
            <div class="stat-card"><div class="stat-value" id="count-active" style="color:#34C759">--</div><div class="stat-label">運行中</div></div>
            <div class="stat-card"><div class="stat-value" id="count-warning" style="color:#FF9F0A">--</div><div class="stat-label">催款警告</div></div>
        </div>

        <div class="search-container">
            <input type="text" id="search-bar" class="search-input" placeholder="🔍 搜尋店號、顧客名、金鑰、或輸入「過期」..." onkeyup="filterKeys()">
        </div>
    </div>

    <div id="key-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        try {
            const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
            let total = snap.size, active = 0, warning = 0, now = new Date().getTime();
            listArea.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data(), keyId = doc.id;
                const isPermanent = !data.expire;
                const createdAt = data.createdAt ? data.createdAt.toDate().getTime() : 0;
                const isNew = (now - createdAt) < (24 * 60 * 60 * 1000); 
                
                let timeText = "👑 永久", isExpired = false, progressWidth = 100, color = "#34C759";

                if (!isPermanent) {
                    const diff = data.expire - now;
                    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    progressWidth = Math.max(0, Math.min(100, (days / 30) * 100)); // 以30天為滿額基準
                    
                    if (diff <= 0) { 
                        timeText = "❌ 過期"; isExpired = true; color = "#ff3b30";
                    } else { 
                        timeText = `⏳ ${days}天`; 
                        active++; 
                        if (days <= 7) { warning++; color = "#FF9F0A"; }
                    }
                } else active++;

                const card = document.createElement('div');
                card.className = `key-card ${isExpired ? 'is-expired' : ''} ${isNew ? 'is-new' : ''}`;
                card.dataset.search = `${data.ownerName || ''} ${data.salonId || ''} ${keyId} ${isExpired?'過期':''}`.toLowerCase();
                
                card.innerHTML = `
                    <div style="flex:1; padding-right: 20px;">
                        <div class="owner-name" onclick="editOwner('${keyId}', '${data.ownerName || ''}')">
                            ${data.ownerName || '未命名'}
                            ${isNew ? '<span style="font-size:0.6rem; background:#BF953F; color:#000; padding:2px 6px; border-radius:4px; margin-left:5px; font-weight:900;">NEW</span>' : ''}
                        </div>
                        <div class="key-id-badge">Key: ${keyId} <span class="role-badge ${data.role==='admin'?'role-admin':'role-staff'}">${data.role || 'staff'}</span></div>
                        
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${progressWidth}%; background: ${color}; box-shadow: 0 0 10px ${color}55;"></div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-item"><strong>店號：</strong> ${data.salonId || '--'}</div>
                            <div class="detail-item"><strong>激活：</strong> ${data.activatedAt ? data.activatedAt.toDate().toLocaleDateString() : '未激活'}</div>
                        </div>
                    </div>
                    
                    <div class="status-box">
                        <div class="time-badge" style="background:${color}15; color:${color}">${timeText}</div>
                        <div class="btn-group">
                            ${isExpired ? `
                                <button class="btn-remind" onclick="remindUser('${data.ownerName}', '${keyId}')">
                                    <i class="fab fa-line"></i> 催款
                                </button>
                            ` : ''}
                            ${!isPermanent && !isExpired ? `<button class="quick-plus-btn" onclick="quickRenew('${keyId}', 30)">+30D</button>` : ''}
                            <button class="btn-renew-luxe" onclick="modifyTime('${keyId}')">管理</button>
                            <button class="btn-trash" onclick="deleteKey('${keyId}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
                listArea.appendChild(card);
            });
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-warning').innerText = warning;
        } catch (e) { console.error(e); }
    }

    function filterKeys() {
        const keyword = document.getElementById('search-bar').value.toLowerCase();
        const cards = document.querySelectorAll('.key-card');
        cards.forEach(card => {
            const searchText = card.dataset.search;
            const statusText = card.querySelector('.time-badge').innerText.toLowerCase();
            card.classList.toggle('hidden', !searchText.includes(keyword) && !statusText.includes(keyword));
        });
    }

    async function quickRenew(keyId, days) {
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        const currentExpire = doc.data().expire;
        const now = new Date().getTime();
        let baseTime = (currentExpire && currentExpire > now) ? currentExpire : now;
        let newExpire = baseTime + (days * 24 * 60 * 60 * 1000);
        await db.collection("LicenseKeys_Booking").doc(keyId).update({ expire: newExpire });
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, background: '#1a1a1a', color: '#fff' });
        Toast.fire({ icon: 'success', title: '已秒速續約 30 天' });
        fetchKeys();
    }

    function remindUser(name, keyId) {
        const msg = encodeURIComponent(`小白大師你好！您的 Aether 授權 (${keyId}) 已經到期囉，為了不影響店內運作，請記得聯繫小刀進行續約，謝謝！`);
        window.open(`https://line.me/R/msg/text/?${msg}`);
    }

    async function modifyTime(keyId) {
        const { value: mode } = await Swal.fire({
            title: '授權管理', background: '#1a1a1a', color: '#fff',
            input: 'select',
            inputOptions: { 'add_30': '➕ 續約 30 天', 'custom': '⌨️ 自定義天數', 'to_forever': '💎 升級永久' },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (!mode) return;
        const doc = await db.collection("LicenseKeys_Booking").doc(keyId).get();
        const currentExpire = doc.data().expire;
        const now = new Date().getTime();
        let baseTime = (currentExpire && currentExpire > now) ? currentExpire : now;
        let newExpire = (mode === 'to_forever') ? null : baseTime;

        if (mode !== 'to_forever') {
            let addDays = (mode === 'add_30') ? 30 : 0;
            if (mode === 'custom') {
                const { value: cDays } = await Swal.fire({ title: '增加天數', input: 'number', background: '#1a1a1a', color: '#fff' });
                addDays = parseInt(cDays);
            }
            if (addDays > 0) newExpire = baseTime + (addDays * 24 * 60 * 60 * 1000);
            else return;
        }
        await db.collection("LicenseKeys_Booking").doc(keyId).update({ expire: newExpire });
        fetchKeys();
    }

    async function deleteKey(keyId) {
        const res = await Swal.fire({
            title: '確定註銷？', text: "刪除後對方的系統將立即失效！", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ff3b30', background: '#1a1a1a', color: '#fff'
        });
        if (res.isConfirmed) {
            await db.collection("LicenseKeys_Booking").doc(keyId).delete();
            fetchKeys();
        }
    }

    async function editOwner(keyId, currentName) {
        const { value: newName } = await Swal.fire({
            title: '編輯備註', input: 'text', inputValue: currentName,
            background: '#1a1a1a', color: '#fff', confirmButtonColor: '#BF953F', showCancelButton: true
        });
        if (newName !== undefined) {
            await db.collection("LicenseKeys_Booking").doc(keyId).update({ ownerName: newName });
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
