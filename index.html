<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 原始中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-gold: #BF953F;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
            --danger: #ff453a;
        }

        body { background: #000; margin: 0; padding: 20px; font-family: 'Montserrat', 'Noto Sans TC', sans-serif; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .title-brand { font-size: 2.2rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-add-main { background: var(--gold-gradient); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 900; cursor: pointer; }

        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(40px);
        }
        .salon-id-badge { color: var(--eth-gold); font-weight: 800; font-size: 1.1rem; }
        .btn-action { background: var(--gold-gradient); color: #000; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 800; cursor: pointer; }
        .btn-del { color: var(--danger); margin-left: 15px; cursor: pointer; opacity: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 class="title-brand">AETHER MASTER</h1>
        <button class="btn-add-main" onclick="createNewLicense()"><i class="fas fa-plus"></i> 生成副鑰匙</button>
    </div>

    <div id="loading-view" style="text-align:center; padding:50px;">📡 讀取授權檔案中...</div>
    <div id="key-list"></div>
</div>

<script>
    // 這裡請填入你原本的 Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
        document.getElementById('loading-view').style.display = 'none';
        listArea.innerHTML = '';

        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id; // 這就是那串亂碼 ID (副鑰匙)
            const isBlocked = data.status === 'blocked';
            
            const card = document.createElement('div');
            card.className = 'key-card';
            card.innerHTML = `
                <div>
                    <h2 style="margin:0;">${data.ownerName || '未命名的鑰匙'}</h2>
                    <div class="salon-id-badge">對應店號：${data.salonId}</div>
                    <div style="font-size:0.8rem; opacity:0.5; margin-top:5px;">鑰匙 ID：${id}</div>
                </div>
                <div style="text-align:right;">
                    <div style="color:${isBlocked ? 'red' : '#32D74B'}; font-weight:900; margin-bottom:10px;">
                        ${isBlocked ? '🚫 已封鎖' : '✅ 正常使用'}
                    </div>
                    <button class="btn-action" onclick="manageKey('${id}')">管理</button>
                    <i class="fas fa-trash btn-del" onclick="deleteKey('${id}')"></i>
                </div>
            `;
            listArea.appendChild(card);
        });
    }

    // 🚀 生成新鑰匙邏輯 (這就是你記憶中那個獨立生成的功能)
    async function createNewLicense() {
        const { value: f } = await Swal.fire({
            title: '生成新授權副鑰匙',
            html: '<input id="sw-n" class="swal2-input" placeholder="備註名稱 (例如：店長平板)"><input id="sw-i" class="swal2-input" placeholder="對應店號">',
            preConfirm: () => ({ name: document.getElementById('sw-n').value, shop: document.getElementById('sw-i').value })
        });

        if (f && f.shop) {
            // 生成一串不相干的亂碼當 ID
            const randomKey = 'KEY-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            await db.collection("LicenseKeys_Booking").doc(randomKey).set({
                salonId: f.shop.trim().toUpperCase(),
                ownerName: f.name,
                status: "active",
                createdAt: Date.now(),
                expire: null
            });
            Swal.fire('成功', '新鑰匙已生成', 'success');
            fetchKeys();
        }
    }

    async function manageKey(id) {
        const { value: mode } = await Swal.fire({
            title: '授權管理',
            input: 'select',
            inputOptions: { 'active': '恢復使用', 'block': '🚫 封鎖斷電' }
        });
        if (mode) {
            await db.collection("LicenseKeys_Booking").doc(id).update({ status: mode === 'block' ? 'blocked' : 'active' });
            fetchKeys();
        }
    }

    async function deleteKey(id) {
        if (confirm("確定刪除此鑰匙紀錄？")) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
