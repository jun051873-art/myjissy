<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 授權中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-gold: #BF953F;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
            --danger: #ff453a;
        }

        body { background: #000; margin: 0; padding: 20px; font-family: 'Montserrat', 'Noto Sans TC', sans-serif; color: #fff; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .title-brand { font-size: 2.2rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .btn-add-main { background: var(--gold-gradient); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px rgba(191,149,63,0.3); }

        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(40px);
        }
        .editable-name { cursor: pointer; color: #fff; margin: 0; }
        .btn-action { background: var(--gold-gradient); color: #000; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 800; cursor: pointer; }
        .btn-del { color: var(--danger); margin-left: 15px; cursor: pointer; opacity: 0.6; }
        .btn-del:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 class="title-brand">AETHER MASTER</h1>
        <button class="btn-add-main" onclick="createNewShop()"><i class="fas fa-plus"></i> 生成新金鑰</button>
    </div>

    <div id="key-list"></div>
</div>

<script>
    // 你的 Firebase 配置 (已校對)
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allKeysCache = {}; 

    // 🚀 1. 生成金鑰頁面邏輯：使用隨機 REC ID
    async function createNewShop() {
        const { value: formValues } = await Swal.fire({
            title: '生成新金鑰',
            background: '#121212', color: '#fff',
            html:
                '<input id="swal-name" class="swal2-input" placeholder="負責人姓名">' +
                '<input id="swal-id" class="swal2-input" placeholder="店號 (如: SHOP01)">',
            confirmButtonColor: '#BF953F',
            preConfirm: () => {
                return {
                    name: document.getElementById('swal-name').value,
                    shopID: document.getElementById('swal-id').value.toUpperCase()
                }
            }
        });

        if (formValues && formValues.shopID) {
            const recordId = "REC" + Date.now().toString().slice(-6);
            await db.collection("LicenseKeys_Booking").doc(recordId).set({
                ownerName: formValues.name,
                salonId: formValues.shopID,
                status: "active",
                createdAt: Date.now(),
                expire: null // 永久
            });
            fetchKeys();
        }
    }

    // 🚀 2. 顯示頁面邏輯：看到店號與負責人
    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
        listArea.innerHTML = '';
        
        snap.forEach(doc => {
            const data = doc.data();
            const keyId = doc.id;
            allKeysCache[keyId] = data;

            const card = document.createElement('div');
            card.className = 'key-card';
            card.innerHTML = `
                <div>
                    <h2 class="editable-name">${data.ownerName || '未命名'}</h2>
                    <div style="color:var(--eth-gold); font-weight:800;">店號：${data.salonId}</div>
                    <div style="font-size:0.8rem; opacity:0.5;">金鑰ID: ${keyId}</div>
                </div>
                <div style="text-align:right;">
                    <div style="margin-bottom:10px; font-weight:bold;">
                        ${data.expire ? '⏳ ' + new Date(data.expire).toLocaleDateString() : '💎 永久授權'}
                    </div>
                    <button class="btn-action" onclick="manageLicense('${keyId}')">管理授權</button>
                    <i class="fas fa-trash btn-del" onclick="deleteKey('${keyId}')"></i>
                </div>
            `;
            listArea.appendChild(card);
        });
    }

    // 🚀 3. 管理授權邏輯：加天數、封鎖、永久
    async function manageLicense(id) {
        const data = allKeysCache[id];
        const { value: mode } = await Swal.fire({
            title: '管理授權',
            input: 'select',
            inputOptions: {
                'append': '🟢 續約 (增加天數)',
                'reset': '🔵 重設 (從頭起算)',
                'forever': '👑 設為永久',
                'block': '🚫 立即封鎖'
            },
            confirmButtonColor: '#BF953F',
            showCancelButton: true
        });

        if (!mode) return;

        if (mode === 'block') {
            await db.collection("LicenseKeys_Booking").doc(id).update({ status: 'blocked' });
            // 同步鎖定主資料庫
            await db.collection("Salons").doc(data.salonId).update({ status: 'blocked' }).catch(()=>{});
        } else if (mode === 'forever') {
            await updateLicense(id, data.salonId, null);
        } else {
            const { value: days } = await Swal.fire({ title: '天數', input: 'number' });
            if (days) {
                let base = (mode === 'append' && data.expire > Date.now()) ? data.expire : Date.now();
                let final = base + (days * 86400000);
                await updateLicense(id, data.salonId, final);
            }
        }
        fetchKeys();
    }

    async function updateLicense(keyDocId, salonId, expireTime) {
        // 更新金鑰文件
        await db.collection("LicenseKeys_Booking").doc(keyDocId).update({ 
            expire: expireTime, 
            status: 'active' 
        });
        // 🚀 關鍵同步：確保主程式 V318 的 checkLicense 能讀到
        await db.collection("Salons").doc(salonId).set({ 
            expiryDate: expireTime, 
            status: 'active' 
        }, { merge: true });
    }

    async function deleteKey(id) {
        if (confirm("確定刪除此金鑰？")) {
            await db.collection("LicenseKeys_Booking").doc(id).delete();
            fetchKeys();
        }
    }

    window.onload = fetchKeys;
</script>
</body>
</html>
