<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aether Master | 數據中樞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --eth-gold: #BF953F;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 100%);
            --danger: #ff453a;
        }

        body {
            background: #000; margin: 0; padding: 20px;
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            color: var(--text-primary); min-height: 100vh;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(191, 149, 63, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(0, 80, 255, 0.08) 0%, transparent 40%);
            z-index: -1;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .title-brand {
            font-size: 3rem; font-weight: 900; text-align: center; letter-spacing: -2px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 40px; filter: drop-shadow(0 0 10px rgba(191,149,63,0.2));
        }

        .key-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(40px); transition: 0.3s;
        }
        .key-card.is-sub { transform: scale(0.96); border-left: 5px solid #007AFF; opacity: 0.9; }
        .key-card.is-ghost { border: 1px solid var(--danger); background: rgba(255, 69, 58, 0.08); }

        .role-tag { font-size: 0.65rem; font-weight: 900; padding: 4px 10px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
        .role-master { background: var(--gold-gradient); color: #000; }
        .role-sub { background: #007AFF; color: #fff; }

        .detail-drawer {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 600px; height: 100vh;
            background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(80px); z-index: 2000;
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-left: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
        }
        .detail-drawer.active { right: 0; box-shadow: -20px 0 60px rgba(0,0,0,0.8); }

        .drawer-header { padding: 30px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 30px; }

        .data-hero { background: rgba(255,255,255,0.03); border-radius: 25px; padding: 30px; text-align: center; margin-bottom: 30px; border: 1px solid var(--glass-border); }
        .revenue-val { font-size: 3rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .record-card {
            background: rgba(255,255,255,0.03); padding: 18px; border-radius: 18px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .btn-action { background: var(--gold-gradient); color: #000; border: none; border-radius: 15px; padding: 10px 22px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { transform: scale(1.05); }

        .tag-pill { background: rgba(191,149,63,0.1); color: var(--eth-gold); padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; margin-right: 6px; margin-bottom: 6px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title-brand">AETHER MASTER</h1>
    <div id="key-list"></div>
</div>

<div id="detail-drawer" class="detail-drawer">
    <div class="drawer-header">
        <h2 id="drawer-owner-name" style="margin:0;">-</h2>
        <div onclick="closeDrawer()" style="cursor:pointer; font-size:1.8rem; opacity:0.5;">&times;</div>
    </div>
    <div class="drawer-body" id="drawer-content"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMgz-UEFux6v1kcZhuvHaeSxhqxx-9zT4",
        authDomain: "salonsystem-71566.firebaseapp.com",
        projectId: "salonsystem-71566",
        storageBucket: "salonsystem-71566.firebasestorage.app",
        messagingSenderId: "629392896879",
        appId: "1:629392896879:web:88111e1d5416eb104fee9a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allKeysCache = {}; 

    async function fetchKeys() {
        const listArea = document.getElementById('key-list');
        const snap = await db.collection("LicenseKeys_Booking").orderBy("createdAt", "desc").get();
        listArea.innerHTML = '';
        allKeysCache = {};

        // 🔹 建立全局快取，修復誤跳紅字問題
        snap.forEach(doc => { allKeysCache[doc.id] = { id: doc.id, ...doc.data() }; });

        snap.forEach(doc => {
            const data = doc.data(), keyId = doc.id;
            const isSub = data.parentKey || data.masterId || (data.role === 'staff');
            const parentKeyId = data.parentKey || data.masterId || "";
            const masterInfo = isSub ? allKeysCache[parentKeyId] : null;
            const isGhost = isSub && !masterInfo;

            let timeTxt = "💎 永久授權";
            let statusColor = "#32D74B";
            if (data.expire) {
                const days = Math.ceil((data.expire - Date.now()) / 86400000);
                if (days <= 0) { timeTxt = "❌ 已過期"; statusColor = "#ff453a"; }
                else { timeTxt = `⏳ 剩餘 ${days} 天`; }
            }

            const card = document.createElement('div');
            card.className = `key-card ${isSub ? 'is-sub' : ''} ${isGhost ? 'is-ghost' : ''}`;
            card.innerHTML = `
                <div style="flex:1">
                    <h2 style="margin:0;" onclick="editName('${keyId}', '${data.ownerName || ''}')">
                        ${data.ownerName || '未命名'} <span class="role-tag ${isSub ? 'role-sub' : 'role-master'}">${isSub ? '副金鑰' : '主金鑰'}</span>
                    </h2>
                    <div style="margin-top:10px; cursor:pointer; color:var(--eth-gold); font-size:0.9rem;" onclick="openDetail('${keyId}')">
                        <i class="fas fa-chart-line"></i> 穿透查看每筆顧客明細
                    </div>
                    <div style="font-size:0.75rem; margin-top:8px; opacity:0.5;">
                        ${isSub ? (isGhost ? '<span style="color:var(--danger)">⚠️ 主金鑰已剔除</span>' : `隸屬：${masterInfo.ownerName}`) : `店號：${data.salonId}`}
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="color:${statusColor}; font-weight:800; margin-bottom:12px;">${timeTxt}</div>
                    <button class="btn-action" onclick="manageLicense('${keyId}')">管理</button>
                </div>
            `;
            listArea.appendChild(card);
        });
    }

    async function manageLicense(id) {
        const { value: mode } = await Swal.fire({
            title: '授權管理中心',
            background: '#121212', color: '#fff',
            input: 'select',
            inputOptions: {
                'append': '🟢 思路一：疊加天數 (續約用)',
                'reset': '🔵 思路二：修正天數 (校正用)',
                'forever': '👑 升級為永久版'
            },
            confirmButtonColor: '#BF953F', showCancelButton: true
        });

        if (!mode) return;
        const now = Date.now();
        let currentExpire = allKeysCache[id].expire || now;
        if (currentExpire < now) currentExpire = now;

        if (mode === 'forever') {
            await db.collection("LicenseKeys_Booking").doc(id).update({ expire: null });
        } else {
            const { value: days } = await Swal.fire({
                title: mode === 'append' ? '要疊加幾天？' : '修正為幾天？',
                input: 'number', background: '#121212', color: '#fff'
            });

            if (days === undefined || days === "") return;
            let finalExpire = (mode === 'append') ? currentExpire + (parseInt(days) * 86400000) : now + (parseInt(days) * 86400000);
            await db.collection("LicenseKeys_Booking").doc(id).update({ expire: finalExpire });
        }
        fetchKeys();
        Swal.fire({ icon: 'success', title: '更新成功', background: '#121212', color: '#fff', timer: 1000 });
    }

    async function openDetail(id) {
        const data = allKeysCache[id];
        const drawer = document.getElementById('detail-drawer');
        const content = document.getElementById('drawer-content');
        document.getElementById('drawer-owner-name').innerText = data.ownerName;
        drawer.classList.add('active');
        content.innerHTML = '<div style="text-align:center; padding:50px;"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>正在獲取顧客實時明細...</div>';

        try {
            const sSnap = await db.collection("Salons").doc(data.salonId).get();
            const sData = sSnap.exists ? sSnap.data() : {};
            const apps = sData.appointments || [];
            const serviceItems = sData.serviceItems || [];
            let totalRev = 0;
            apps.forEach(a => { if(a.done) totalRev += parseFloat(a.price || 0); });

            content.innerHTML = `
                <div class="data-hero">
                    <div style="opacity:0.6; font-size:0.8rem; letter-spacing:2px;">TOTAL REVENUE</div>
                    <div class="revenue-val">$${totalRev.toLocaleString()}</div>
                </div>

                <div style="margin-bottom:20px; font-weight:800; border-left:4px solid var(--eth-gold); padding-left:12px;">店內服務項目</div>
                <div style="margin-bottom:30px;">
                    ${serviceItems.length ? serviceItems.map(s => `<span class="tag-pill">${s.name || s}</span>`).join('') : '<span style="opacity:0.3">未設定項目</span>'}
                </div>

                <div style="margin-bottom:20px; font-weight:800; border-left:4px solid var(--eth-gold); padding-left:12px;">每筆顧客明細 (${apps.length})</div>
                ${apps.reverse().map(a => `
                    <div class="record-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:700;">${a.name} <small style="opacity:0.4; font-weight:400;">${a.phone || ''}</small></span>
                            <span style="color:#32D74B; font-weight:800;">$${a.price || 0}</span>
                        </div>
                        <div style="font-size:0.8rem; opacity:0.6; line-height:1.6;">
                            時間：${a.date} <br>
                            項目：${a.note || '未填寫'} <br>
                            狀態：${a.done ? '✅ 已結帳' : '⏳ 預約中'}
                        </div>
                    </div>
                `).join('') || '<div style="text-align:center; opacity:0.3;">尚無消費數據</div>'}
            `;
        } catch (e) { content.innerHTML = '<div style="text-align:center;">數據提取失敗</div>'; }
    }

    async function editName(id, current) {
        const { value: val } = await Swal.fire({ title: '編輯名稱', input: 'text', inputValue: current, background: '#121212', color: '#fff' });
        if (val) { await db.collection("LicenseKeys_Booking").doc(id).update({ ownerName: val }); fetchKeys(); }
    }

    function closeDrawer() { document.getElementById('detail-drawer').classList.remove('active'); }
    window.onload = fetchKeys;
</script>
</body>
</html>
